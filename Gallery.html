<script>

/*assigns every img or gif with the showcoverview function */

var imgelements = document.querySelectorAll(".Gallery_body img");
var imgsrc = "showcoverview(src)";
for (var i=0; i<imgelements.length; i++){
	imgelements[i].addEventListener('click', function(){showcoverview(this)});
}

/*toggles between tags */

function show(tagname){
	var taglist = document.querySelectorAll(tagname);
	var allelem = document.querySelectorAll(".Gallery_body img, video")
	for  (var i = 0; i<allelem.length; i++){
	allelem[i].style.display="none";
	}
	for  (var i = 0; i<taglist.length; i++){
	taglist[i].style.display="inline-block";
	}
}

/*Opens coverview*/

function showcoverview(filename){
let srcstring = filename.src;
var imgsrcnew = srcstring.replace(".png","_full.png");
document.querySelector(".cover").style.display= "block";
document.querySelector(".coverimg").src= imgsrcnew;
document.querySelector(".coverimg").alt= imgsrcnew;
}
function hidecoverview(){
if(zoom<0){
enLarge();
}
document.querySelector(".cover").style.display= "none";
}

/*Enlarges or shrinks image */

var zoom = 1;
var draggable = false;
function enLarge(){
const elemheight = document.querySelector(".coverimg").offsetHeight;
var height = elemheight;
if(zoom < 0){
height /=2;
document.querySelector(".coverimg").style.height = height+"px";
document.querySelector(".coverimg").style.maxHeight = 100+"%";
document.querySelector(".coverimg").style.maxWidth = 100+"%";
document.querySelector(".coverimg").style.top = "50vh";
document.querySelector(".coverimg").style.left = "50vw";
}
else{
height *=2;
document.querySelector(".coverimg").style.height = height+"px";
document.querySelector(".coverimg").style.maxHeight = 500+"%";
document.querySelector(".coverimg").style.maxWidth = 500+"%";
}
zoom= zoom*-1;
draggable = !draggable;
}


/* drag function */

let draggableElem = document.querySelector(".coverimg");
let initialX = 0;
	initialY = 0;
let moveElement = false;

let events = {
	down: "mousedown",
	move: "mousemove",
	up: "mouseup",
}

draggableElem.addEventListener(events.down,(e) => {
	e.preventDefault();
	initialX = e.clientX;
	initialY = e.clientY;
	
	moveElement = true;
	document.querySelector('.coverimg').onclick = () => enLarge();
})

draggableElem.addEventListener(events.move, (e) => {
	if(moveElement && draggable) {
		e.preventDefault();
		let newX = e.clientX;
		let newY = e.clientY;
		draggableElem.style.top = draggableElem.offsetTop - (initialY - newY) + "px";
		draggableElem.style.left = draggableElem.offsetLeft - (initialX - newX) + "px";
		initialX = newX;
		initialY = newY;
		document.querySelector('.coverimg').onclick = null;
	}
});

draggableElem.addEventListener(events.up, (stopMovement = (e) => {
	moveElement = false;
	})
);

draggableElem.addEventListener("mouseleave", stopMovement);
draggableElem.addEventListener(events.up, (e) => {
	moveElement = false;
	});

</script>
