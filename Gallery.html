<script>
var imgelements = document.querySelectorAll(".Gallery_body img");
var imgsrc = "showcoverview(src)";
for (var i=0; i<imgelements.length; i++){
	imgelements[i].addEventListener('click', function(){showcoverview(this)});
}
function showcoverview(filename){
document.querySelector(".cover").style.display= "block";
document.querySelector(".coverimg").src= filename.src;
document.querySelector(".coverimg").alt= filename.src;
}
function hidecoverview(){
if(zoom<0){
enLarge();
}
document.querySelector(".cover").style.display= "none";
}
var zoom = 1;
var draggable = false;
function enLarge(){
const elemheight = document.querySelector(".coverimg").offsetHeight;
var height = elemheight;
if(zoom < 0){
height /=2;
document.querySelector(".coverimg").style.height = height+"px";
document.querySelector(".coverimg").style.top = "50vh";
document.querySelector(".coverimg").style.left = "50vw";
}
else{
height *=2;
document.querySelector(".coverimg").style.height = height+"px";
}
zoom= zoom*-1;
draggable = !draggable;
}

let draggableElem = document.querySelector(".coverimg");
let initialX = 0;
	initialY = 0;
let moveElement = false;

let events = {
	down: "mousedown",
	move: "mousemove",
	up: "mouseup",
}

draggableElem.addEventListener(events.down,(e) => {
	e.preventDefault();
	initialX = e.clientX;
	initialY = e.clientY;
	
	moveElement = true;
	document.querySelector('.coverimg').onclick = () => enLarge();
})

draggableElem.addEventListener(events.move, (e) => {
	if(moveElement && draggable) {
		e.preventDefault();
		let newX = e.clientX;
		let newY = e.clientY;
		draggableElem.style.top = draggableElem.offsetTop - (initialY - newY) + "px";
		draggableElem.style.left = draggableElem.offsetLeft - (initialX - newX) + "px";
		initialX = newX;
		initialY = newY;
		document.querySelector('.coverimg').onclick = null;
	}
});

draggableElem.addEventListener(events.up, (stopMovement = (e) => {
	moveElement = false;
	})
);

draggableElem.addEventListener("mouseleave", stopMovement);
draggableElem.addEventListener(events.up, (e) => {
	moveElement = false;
	});

</script>
